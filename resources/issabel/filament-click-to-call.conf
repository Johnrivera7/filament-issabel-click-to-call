; =============================================================================
; Filament Issabel Click-to-Call — contexto para visor del ejecutivo
; =============================================================================
;
; POR QUÉ EXISTE ESTE ARCHIVO
; ---------------------------
; Issabel/FreePBX guarda un CNAM por anexo (ej. "Mariela Lopez" en 2150).
; Si Laravel origina directo a SIP/2150, el teléfono muestra el anexo, no el
; celular del alumno. Las variables AMI CallerID no bastan: FreePBX las pisa.
;
; Este contexto fija CALLERID al destino (CTC_DEST) ANTES de Dial(SIP/anexo).
; El plugin envía CTC_* por AMI y usa estrategia custom_agent.
;
; INSTALACIÓN (una vez en el servidor Issabel)
; --------------------------------------------
; 1. Copiar este bloque a /etc/asterisk/extensions_custom.conf
; 2. Si usa PJSIP, cambie SIP por PJSIP en la línea Dial()
; 3. asterisk -rx "dialplan reload"
;
; Ver docs/ISSABEL_VISOR_DESTINO.md en el paquete Composer.
; =============================================================================

[filament-click-to-call]
exten => _X.,1,NoOp(Filament click-to-call anexo ${EXTEN} destino ${CTC_DEST})
 same => n,Set(CALLERID(name)=${IF($["${CTC_NAME}"=""]?${CTC_DEST}:${CTC_NAME})})
 same => n,Set(CALLERID(num)=${IF($["${CTC_NUM}"=""]?${CTC_DEST}:${CTC_NUM})})
 same => n,Set(CALLERID(name-pres)=allowed_not_screened)
 same => n,Set(CALLERID(num-pres)=allowed_not_screened)
 same => n,Dial(SIP/${EXTEN},30,m)
 same => n,Hangup()
