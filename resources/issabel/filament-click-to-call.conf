; =============================================================================
; Filament Issabel Click-to-Call — AMBOS contextos son obligatorios
; =============================================================================
;
; [filament-click-to-call]  → suena el anexo; visor = celular destino
; [filament-ctc-out]        → al contestar: CID=anexo y Dial Local/@from-internal
;
; INSTALACIÓN
; 1. Reemplazar AMBOS bloques en /etc/asterisk/extensions_custom.conf
; 2. Si usa PJSIP: Dial(PJSIP/${EXTEN},30,m)
; 3. asterisk -rx "dialplan reload"
; =============================================================================

[filament-click-to-call]
exten => _X.,1,NoOp(Filament CTC ring anexo=${EXTEN} dest=${CTC_DEST})
 same => n,Set(CALLERID(name)=${IF($["${CTC_NAME}"=""]?${CTC_DEST}:${CTC_NAME})})
 same => n,Set(CALLERID(num)=${IF($["${CTC_NUM}"=""]?${CTC_DEST}:${CTC_NUM})})
 same => n,Set(CALLERID(name-pres)=allowed_not_screened)
 same => n,Set(CALLERID(num-pres)=allowed_not_screened)
 same => n,Dial(SIP/${EXTEN},30,m)
 same => n,Hangup()

; Exten AMI = número destino (ej. 955170937). Resetea CID al anexo y marca.
[filament-ctc-out]
exten => _X.,1,NoOp(Filament CTC out dest=${EXTEN} anexo=${CTC_ANEXO} amp=${AMPUSER})
 same => n,Set(CTC_ANEXO=${IF($["${CTC_ANEXO}"=""]?${AMPUSER}:${CTC_ANEXO})})
 same => n,GotoIf($["${CTC_ANEXO}"=""]?fail)
 same => n,Set(AMPUSER=${CTC_ANEXO})
 same => n,Set(CALLERID(num)=${CTC_ANEXO})
 same => n,Set(CALLERID(name)=${CTC_ANEXO})
 same => n,Dial(Local/${EXTEN}@from-internal/n,60)
 same => n,Hangup()
 same => n(fail),Playback(ss-noservice)
 same => n,Hangup()
