; =============================================================================
; Filament Issabel Click-to-Call — contextos obligatorios
; =============================================================================
;
; MODO A — Anexo primero (actual):
;   [filament-click-to-call]  → suena el anexo; visor = celular destino
;   [filament-ctc-out]        → al contestar: CID=anexo y Dial Local/@from-internal
;
; MODO B — Destino primero (menor abandono):
;   [filament-ctc-dest-first] → marca el celular; al contestar → bridge agents
;   [filament-ctc-bridge-agents] → anexo asignado → failover → supervisor
;   Si el asignado no contesta: TrySystem curl al webhook kitinicio
;
; INSTALACIÓN
; 1. Pegar TODOS los bloques en /etc/asterisk/extensions_custom.conf
; 2. Si usa PJSIP en anexos: en click-to-call puede usar Dial(PJSIP/${EXTEN},30,m)
; 3. asterisk -rx "dialplan reload"
; =============================================================================

[filament-click-to-call]
exten => _X.,1,NoOp(Filament CTC ring anexo=${EXTEN} dest=${CTC_DEST})
 same => n,Set(CALLERID(name)=${IF($["${CTC_NAME}"=""]?${CTC_DEST}:${CTC_NAME})})
 same => n,Set(CALLERID(num)=${IF($["${CTC_NUM}"=""]?${CTC_DEST}:${CTC_NUM})})
 same => n,Set(CALLERID(name-pres)=allowed_not_screened)
 same => n,Set(CALLERID(num-pres)=allowed_not_screened)
 same => n,Dial(SIP/${EXTEN},30,m)
 same => n,Hangup()

[filament-ctc-out]
exten => _X.,1,NoOp(Filament CTC out dest=${EXTEN} anexo=${CTC_ANEXO} amp=${AMPUSER})
 same => n,Set(CTC_ANEXO=${IF($["${CTC_ANEXO}"=""]?${AMPUSER}:${CTC_ANEXO})})
 same => n,GotoIf($["${CTC_ANEXO}"=""]?fail)
 same => n,Set(AMPUSER=${CTC_ANEXO})
 same => n,Set(CALLERID(num)=${CTC_ANEXO})
 same => n,Set(CALLERID(name)=${CTC_ANEXO})
 same => n,Dial(Local/${EXTEN}@from-internal/n,60)
 same => n,Hangup()
 same => n(fail),Playback(ss-noservice)
 same => n,Hangup()

[filament-ctc-dest-first]
exten => _X.,1,NoOp(Filament CTC dest-first dial ${EXTEN} assigned=${CTC_ANEXO})
 same => n,Dial(Local/${EXTEN}@from-internal/n,60)
 same => n,Hangup()

[filament-ctc-bridge-agents]
exten => s,1,NoOp(Filament CTC bridge assigned=${CTC_ANEXO} fail1=${CTC_FAIL1} fail2=${CTC_FAIL2} sup=${CTC_SUPERVISOR})
 same => n,GotoIf($["${CTC_ANEXO}"=""]?fail)
 same => n,Dial(Local/${CTC_ANEXO}@from-internal/n,25)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n,NoOp(Assigned anexo ${CTC_ANEXO} no answer dialstatus=${DIALSTATUS})
 same => n,GotoIf($["${CTC_HOOK}"=""]?after_hook)
 same => n,TrySystem(curl -sk --max-time 4 "${CTC_HOOK}" >/dev/null 2>&1)
 same => n(after_hook),GotoIf($["${CTC_FAIL1}"!=""]?try_fail1)
 same => n,Goto(try_sup)
 same => n(try_fail1),Dial(Local/${CTC_FAIL1}@from-internal/n,20)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n,GotoIf($["${CTC_FAIL2}"!=""]?try_fail2)
 same => n,Goto(try_sup)
 same => n(try_fail2),Dial(Local/${CTC_FAIL2}@from-internal/n,20)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n(try_sup),GotoIf($["${CTC_SUPERVISOR}"!=""]?ring_sup)
 same => n,Goto(fail)
 same => n(ring_sup),Dial(Local/${CTC_SUPERVISOR}@from-internal/n,25)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n(fail),Playback(ss-noservice)
 same => n,Hangup()
 same => n(done),NoOp(Filament CTC bridged ok)
 same => n,Hangup()
